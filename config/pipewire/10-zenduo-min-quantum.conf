# linux-on-zenbook-duo: keep the audio graph's buffer at or above PipeWire's
# own default, so one application cannot take the sound device down with it.
#
# ── What goes wrong without it (MEASURED 2026-09-19 on UX8406MA) ─────────────
# PipeWire sizes the whole graph from the smallest buffer any single client
# asks for, and that size applies to the ALSA device too, not just to that
# client. Roblox asks for 240 frames, under Sober and under Wine alike:
#
#     node.latency = 240/48000          read off the live stream with pw-dump
#
# The SOF pipeline here does not survive that. It underruns, and PipeWire 1.0.5
# cannot reset the pipeline from its recovery path, so the underrun becomes
# permanent: the device stops producing cycles at all and logs
#
#     spa.alsa: hw:sofhdadspp: (375 suppressed) snd_pcm_avail after recover: Broken pipe
#
# about nineteen times a second. That is the silent-speakers wedge in
# docs/HARDWARE.md, reached in seconds instead of waiting for memory pressure.
#
# Every other stream dies with it, because they all share the device. Measured
# the same day: a test tone started and never finished, and thirteen episodes
# of the loop, the longest 167 minutes, which ended only when PipeWire
# restarted itself after using 14 minutes of CPU on the dead device. Browser
# video stalling is the same fault, not a second one.
#
# ── Why a floor fixes it ─────────────────────────────────────────────────────
# 1024 is PipeWire's own default quantum and 32 is its default floor (both
# commented in /usr/share/pipewire/pipewire.conf). Setting the floor to the
# default means nothing here runs with a smaller buffer than it already did,
# and an app that asks for less is handed 1024 rather than being allowed to
# reconfigure the device. Roblox still gets sound, at 21 ms of latency instead
# of the 5 ms it asked for.
#
# VERIFIED 2026-09-19 with Roblox Studio open and the device already wedged:
# applying this floor to the running server stopped the loop within seconds and
# playback worked again, with nothing restarted and Studio keeping its stream.
#
# ── If you need a small buffer ───────────────────────────────────────────────
# Recording, live monitoring and DAW work do. Turn this off with
# `zenduo.audioBufferFloor = false` or `./install.sh --no-audio-buffer-floor`,
# and expect the wedge when something asks for a buffer the SOF pipeline cannot
# keep up with. Clearing one costs no restart and no client its stream, because
# changing the quantum re-opens the device:
#
#     pw-metadata -n settings 0 clock.min-quantum 1024
context.properties = {
    default.clock.min-quantum = 1024
}
