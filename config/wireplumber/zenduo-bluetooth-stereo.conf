# linux-on-zenbook-duo: keep a Bluetooth headset on its stereo profile when a
# voice app opens the microphone. The reasons and the measurements are in
# 11-zenduo-bluetooth-stereo.lua next to this file, which is the same setting
# for WirePlumber 0.4. This one is read by WirePlumber 0.5 and later from
# wireplumber.conf.d/.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
