# linux-on-zenbook-duo: let rtkit come up before PipeWire asks it for realtime.
#
# ── What goes wrong without it (MEASURED 2026-09-20 on UX8406MA) ────────────
# PipeWire's data loop asks rtkit for realtime priority once, when it starts.
# rtkit-daemon is a system service that D-Bus starts on first use, and a login
# quick enough starts the user's PipeWire in the same second (journal, this
# boot: pipewire.service started 21:04:42, rtkit-daemon "Running" 21:04:43).
# When that happens the request is lost and the data loop runs the whole
# session at normal priority, where a busy game can hold it up. Two of the
# last five boots on this machine ran that way; in the other three PipeWire
# started 6 to 11 seconds after rtkit and got priority 20.
#
# rtkit granted the same threads priority 20 later in the session when asked
# again (MakeThreadRealtimeWithPID), so nothing but the order is wrong.
#
# ── What this file does ─────────────────────────────────────────────────────
# Before the service starts, ask rtkit for one property over the system bus.
# The call starts rtkit if it is not running and returns once it answers, so
# the request PipeWire makes next finds it there. The leading "-" makes a
# failure (no rtkit installed, no system bus) a no-op, and the timeout keeps a
# broken rtkit from holding up sound. Installed for pipewire.service,
# pipewire-pulse.service and wireplumber.service.
[Service]
ExecStartPre=-busctl --system --quiet --timeout=10 call org.freedesktop.RealtimeKit1 /org/freedesktop/RealtimeKit1 org.freedesktop.DBus.Properties Get ss org.freedesktop.RealtimeKit1 MaxRealtimePriority
